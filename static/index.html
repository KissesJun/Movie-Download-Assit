<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Movie Downloader</title>
  <style>
    /* ── Reset & Base ─────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --card:      #21253a;
      --border:    #2e3350;
      --accent:    #4a9eff;
      --accent2:   #00d4aa;
      --danger:    #ff5c5c;
      --text:      #e8eaf0;
      --muted:     #7a7f9a;
      --seed:      #4caf50;
      --badge-4k:  #ff9800;
      --badge-hd:  #4a9eff;
      --badge-sd:  #78909c;
      --yts:       #6ab04c;
      --eztv:      #7b68ee;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ───────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .logo span { color: var(--accent); }

    .header-right { display: flex; gap: 12px; align-items: center; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--seed);
      box-shadow: 0 0 6px var(--seed);
    }

    .qbt-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-decoration: none;
      transition: border-color .2s, background .2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qbt-btn:hover { border-color: var(--accent); background: #253050; }

    /* ── Search Section ───────────────────────── */
    .search-section {
      max-width: 860px;
      margin: 48px auto 32px;
      padding: 0 24px;
      text-align: center;
    }

    .search-section h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .search-section p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .search-bar {
      display: flex;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color .2s;
    }
    .search-bar:focus-within { border-color: var(--accent); }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px 20px;
      color: var(--text);
      font-size: 15px;
    }

    #search-input::placeholder { color: var(--muted); }

    .source-select {
      background: var(--card);
      border: none;
      border-left: 1px solid var(--border);
      color: var(--muted);
      padding: 0 14px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .search-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-btn:hover { background: #3a8ef0; }
    .search-btn:disabled { background: var(--muted); cursor: not-allowed; }

    /* ── Results Area ─────────────────────────── */
    .results-area {
      max-width: 860px;
      margin: 0 auto 60px;
      padding: 0 24px;
    }

    .results-meta {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Movie Card ───────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 0;
      overflow: hidden;
      transition: border-color .2s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }

    .card-cover {
      width: 80px;
      min-width: 80px;
      object-fit: cover;
      background: var(--surface);
    }

    .card-cover-placeholder {
      width: 80px;
      min-width: 80px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--muted);
    }

    .card-body {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-info { flex: 1; min-width: 200px; }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .rating { color: #ffd700; }

    /* ── Badges ───────────────────────────────── */
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .badge-4k  { background: rgba(255,152,0,.15); color: var(--badge-4k); border: 1px solid rgba(255,152,0,.3); }
    .badge-hd  { background: rgba(74,158,255,.15); color: var(--badge-hd); border: 1px solid rgba(74,158,255,.3); }
    .badge-sd  { background: rgba(120,144,156,.15); color: var(--badge-sd); border: 1px solid rgba(120,144,156,.3); }
    .badge-yts { background: rgba(106,176,76,.15);  color: var(--yts); border: 1px solid rgba(106,176,76,.3); }
    .badge-eztv{ background: rgba(123,104,238,.15); color: var(--eztv); border: 1px solid rgba(123,104,238,.3); }

    /* ── Stats ────────────────────────────────── */
    .card-stats {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .seeds {
      color: var(--seed);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .seeds::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--seed);
      display: inline-block;
    }

    /* ── Download Button ──────────────────────── */
    .dl-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dl-btn:hover { background: #3a8ef0; transform: scale(1.03); }
    .dl-btn:active { transform: scale(.97); }
    .dl-btn.done { background: var(--seed); cursor: default; }
    .dl-btn.done:hover { transform: none; }

    /* ── States ───────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
    }
    .state-box .icon { font-size: 48px; margin-bottom: 16px; }
    .state-box p { font-size: 15px; }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--surface);
      border: 1px solid var(--accent2);
      color: var(--accent2);
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
      transform: translateY(80px);
      opacity: 0;
      transition: transform .3s, opacity .3s;
      z-index: 999;
      max-width: 360px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.error { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────── -->
<header>
  <div class="logo">🎬 <span>Movie</span> Downloader</div>
  <div class="header-right">
    <div class="status-dot" title="服务运行中"></div>
    <a class="qbt-btn" href="http://localhost:8080" target="_blank">
      ⬇️ qBittorrent 监控面板
    </a>
  </div>
</header>

<!-- ── Search ──────────────────────────────────── -->
<div class="search-section">
  <h1>找到你想下载的内容</h1>
  <p>支持电影、剧集 · 搜索结果按做种数排序 · 数据来源：YTS · EZTV</p>
  <div class="search-bar">
    <input
      id="search-input"
      type="text"
      placeholder="输入片名，例如：Dune、进击的巨人、Oppenheimer..."
      autocomplete="off"
    />
    <select class="source-select" id="source-select">
      <option value="all">全部来源</option>
      <option value="yts">YTS（电影）</option>
      <option value="eztv">EZTV（剧集）</option>
    </select>
    <button class="search-btn" id="search-btn" onclick="doSearch()">
      🔍 搜索
    </button>
  </div>
</div>

<!-- ── Results ─────────────────────────────────── -->
<div class="results-area">
  <div id="results-meta" class="results-meta" style="display:none"></div>
  <div id="results"></div>
</div>

<!-- ── Toast ───────────────────────────────────── -->
<div id="toast"></div>

<script>
  // ── 回车搜索 ─────────────────────────────────
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  // ── 搜索 ─────────────────────────────────────
  async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;

    const source = document.getElementById('source-select').value;
    const btn = document.getElementById('search-btn');
    const resultsEl = document.getElementById('results');
    const metaEl = document.getElementById('results-meta');

    btn.disabled = true;
    btn.textContent = '搜索中…';
    metaEl.style.display = 'none';
    resultsEl.innerHTML = `
      <div class="state-box">
        <div class="spinner"></div>
        <p>正在搜索 <strong>${escHtml(q)}</strong>…</p>
      </div>`;

    try {
      const resp = await fetch(`/api/search?q=${encodeURIComponent(q)}&source=${source}`);
      const data = await resp.json();

      if (!data.results || data.results.length === 0) {
        resultsEl.innerHTML = `
          <div class="state-box">
            <div class="icon">😔</div>
            <p>没有找到 "<strong>${escHtml(q)}</strong>" 的结果</p>
          </div>`;
        metaEl.style.display = 'none';
      } else {
        metaEl.style.display = 'flex';
        metaEl.innerHTML = `<span>找到 <strong>${data.total}</strong> 个结果，按做种数排序</span>`;
        resultsEl.innerHTML = data.results.map(r => renderCard(r)).join('');
      }
    } catch (err) {
      resultsEl.innerHTML = `
        <div class="state-box">
          <div class="icon">⚠️</div>
          <p>搜索失败：${escHtml(String(err))}</p>
        </div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🔍 搜索';
    }
  }

  // ── 渲染结果卡片 ─────────────────────────────
  function renderCard(r) {
    const qualityBadgeClass =
      r.quality.includes('4') ? 'badge-4k' :
      (r.quality === '1080p' || r.quality === '720p') ? 'badge-hd' : 'badge-sd';

    const sourceBadgeClass = r.source === 'YTS' ? 'badge-yts' : 'badge-eztv';

    const coverHtml = r.cover
      ? `<img class="card-cover" src="${escHtml(r.cover)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholder = `<div class="card-cover-placeholder" ${r.cover ? 'style="display:none"' : ''}>🎬</div>`;

    const rating = r.rating ? `<span class="rating">★ ${r.rating}</span>` : '';
    const year   = r.year   ? `<span>${r.year}</span>` : '';
    const codec  = r.codec  ? `<span>${r.codec}</span>` : '';
    const size   = r.size   ? `<span>💾 ${r.size}</span>` : '';

    const magnetEnc = escHtml(r.magnet);
    const titleEnc  = escHtml(r.title);

    return `
      <div class="card">
        ${coverHtml}${placeholder}
        <div class="card-body">
          <div class="card-info">
            <div class="card-title">${escHtml(r.title)}</div>
            <div class="card-meta">
              <span class="badge ${sourceBadgeClass}">${r.source}</span>
              <span class="badge ${qualityBadgeClass}">${r.quality}</span>
              ${year}${codec}${rating}${size}
            </div>
          </div>
          <div class="card-stats">
            <span class="seeds">🌱 ${r.seeds} 做种</span>
          </div>
          <button
            class="dl-btn"
            onclick="doDownload(this, '${magnetEnc}', '${titleEnc}')"
          >
            ⬇️ 下载
          </button>
        </div>
      </div>`;
  }

  // ── 下载 ─────────────────────────────────────
  async function doDownload(btn, magnet, title) {
    btn.disabled = true;
    btn.textContent = '发送中…';
    try {
      const resp = await fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ magnet, title }),
      });
      const data = await resp.json();
      if (resp.ok) {
        btn.classList.add('done');
        btn.textContent = '✅ 已添加';
        showToast(`✅ 已添加到 qBittorrent：${title}`);
      } else {
        btn.disabled = false;
        btn.innerHTML = '⬇️ 下载';
        showToast(`❌ 失败：${data.detail || '未知错误'}`, true);
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '⬇️ 下载';
      showToast(`❌ 网络错误：${err}`, true);
    }
  }

  // ── Toast 通知 ───────────────────────────────
  let toastTimer;
  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 4000);
  }

  // ── HTML 转义 ────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }
</script>
</body>
</html>
